    <!-- Nagyítás (lightbox) -->
    <div class="nagyitas" id="nagyitas" aria-hidden="true">
        <button class="nagyitas-bezar" id="nagyitasBezar" aria-label="Bezárás">&times;</button>
        <button class="nagyitas-nyil nagyitas-elozo" id="nagyitasElozo" aria-label="Előző kép">&#8249;</button>
        <img src="" alt="" id="nagyitasKep">
        <button class="nagyitas-nyil nagyitas-kovetkezo" id="nagyitasKovetkezo" aria-label="Következő kép">&#8250;</button>
    </div>

    <script>
        (function () {
            var kepek = Array.prototype.slice.call(document.querySelectorAll('.galeria-elem img'));
            var doboz = document.getElementById('nagyitas');
            var nagyKep = document.getElementById('nagyitasKep');
            var aktualis = 0;

            function megnyit(i) {
                aktualis = (i + kepek.length) % kepek.length;
                nagyKep.src = kepek[aktualis].src;
                nagyKep.alt = kepek[aktualis].alt;
                doboz.classList.add('nyitva');
                doboz.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function bezar() {
                doboz.classList.remove('nyitva');
                doboz.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            kepek.forEach(function (kep, i) {
                kep.addEventListener('click', function () { megnyit(i); });
            });

            document.getElementById('nagyitasBezar').addEventListener('click', bezar);
            document.getElementById('nagyitasElozo').addEventListener('click', function () { megnyit(aktualis - 1); });
            document.getElementById('nagyitasKovetkezo').addEventListener('click', function () { megnyit(aktualis + 1); });

            doboz.addEventListener('click', function (e) {
                if (e.target === doboz) { bezar(); }
            });

            document.addEventListener('keydown', function (e) {
                if (!doboz.classList.contains('nyitva')) { return; }
                if (e.key === 'Escape') { bezar(); }
                if (e.key === 'ArrowLeft') { megnyit(aktualis - 1); }
                if (e.key === 'ArrowRight') { megnyit(aktualis + 1); }
            });
        })();
    </script>
